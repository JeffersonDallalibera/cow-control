<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetControl - Controle de Vacinas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html"><i class="fa-solid fa-cow"></i> VetControl</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Painel</a></li>
                    <li class="nav-item"><a class="nav-link" href="rebanho.html">Meu Rebanho</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Controle de Vacinas</h1>
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#modalRegistrarVacinaGeral">
                <i class="fa-solid fa-plus me-2"></i>Registrar Nova Vacina
            </button>
        </div>
        <p>Lista de todas as vacinas aplicadas e próximas doses agendadas.</p>
        <div class="table-responsive">
            <table class="table table-striped table-hover">
                <thead class="table-primary">
                    <tr>
                        <th>Brinco do Animal</th>
                        <th>Nome do Animal</th>
                        <th>Vacina</th>
                        <th>Data Aplicação</th>
                        <th>Próxima Dose</th>
                    </tr>
                </thead>
                <tbody id="tabela-vacinas">
                    </tbody>
            </table>
        </div>
    </main>
    
    <div class="modal fade" id="modalRegistrarVacinaGeral" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Registrar Nova Vacina</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <form id="form-nova-vacina-geral">
                        <div class="mb-3">
                            <label for="vacina-animal-id-select" class="form-label">Selecionar Animal</label>
                            <select id="vacina-animal-id-select" class="form-select" required>
                                <option value="" selected disabled>Carregando animais...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="vacina-data_aplicacao" class="form-label">Data da Aplicação</label>
                            <input type="date" class="form-control" id="vacina-data_aplicacao" required>
                        </div>
                        <div class="mb-3">
                            <label for="vacina-nome_vacina" class="form-label">Nome da Vacina</label>
                            <input type="text" class="form-control" id="vacina-nome_vacina" required>
                        </div>
                        <div class="mb-3">
                            <label for="vacina-dose" class="form-label">Dose</label>
                            <input type="text" class="form-control" id="vacina-dose" placeholder="Ex: 5ml" required>
                        </div>
                        <div class="mb-3">
                            <label for="vacina-dias_revacina" class="form-label">Dias para Revacinação</label>
                            <input type="number" class="form-control" id="vacina-dias_revacina" placeholder="Ex: 365 para anual" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button><button type="submit" form="form-nova-vacina-geral" class="btn btn-primary">Salvar Registro</button></div>
            </div>
        </div>
    </div>


    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2025 VetControl - Projeto de Medicina Veterinária
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
