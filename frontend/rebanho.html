<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetControl - Meu Rebanho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fa-solid fa-cow"></i> VetControl
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Painel</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="rebanho.html">Meu Rebanho</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h1>Meu Rebanho</h1>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAdicionarAnimal">
                <i class="fa-solid fa-plus"></i> Adicionar Animal
            </button>
        </div>
        
        <div class="input-group mb-3">
            <input type="text" id="busca-animal" class="form-control" placeholder="Buscar por brinco ou nome...">
            <button class="btn btn-outline-secondary" type="button" id="btn-busca">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle">
                <thead class="table-primary">
                    <tr>
                        <th>Brinco</th>
                        <th>Nome</th>
                        <th>Data de Nasc.</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-rebanho">
                    </tbody>
            </table>
        </div>
    </main>

    <div class="modal fade" id="modalAdicionarAnimal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Cadastrar Novo Animal</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="form-novo-animal">
                        <div class="mb-3">
                            <label for="brinco" class="form-label">Nº do Brinco</label>
                            <input type="text" class="form-control" id="brinco" required>
                        </div>
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome (Opcional)</label>
                            <input type="text" class="form-control" id="nome">
                        </div>
                        <div class="mb-3">
                            <label for="dataNascimento" class="form-label">Data de Nascimento</label>
                            <input type="date" class="form-control" id="dataNascimento" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="form-novo-animal" class="btn btn-primary">Salvar Animal</button>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="bg-light text-center text-lg-start mt-5">
        <div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
            © 2025 VetControl - Projeto de Medicina Veterinária
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/config.js"></script>
</body>
</html>
